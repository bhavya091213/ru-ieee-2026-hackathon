[project]
name = "focus-group-agent"
version = "0.1.0"
description = "AI-powered synthetic focus group simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "google-api-core>=2.0",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "markdownify>=0.14",
    "praw>=7.7",
    "youtube-transcript-api>=1.0",
    "chromadb>=1.0",
    "google-generativeai>=0.8",
    "pyyaml>=6.0",
    "networkx>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
